<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="llm-json-extract — extract clean, validated JSON from messy LLM output">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#131c3b"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="440" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="130" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="600" cy="126" rx="470" ry="140" fill="url(#glow)"/>

  <!-- faded "messy output" tokens in the background -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.14">
    <text x="64" y="58">&lt;thinking&gt;The user wants...&lt;/thinking&gt;</text>
    <text x="866" y="66">"count": 3,  // trailing comma</text>
    <text x="60" y="152">Sure! Let me think about this.</text>
    <text x="948" y="158">['single', 'quotes']</text>
    <text x="88" y="252">```json ... no closing fence</text>
    <text x="884" y="248">Hope that helps!</text>
  </g>

  <!-- title -->
  <text x="600" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700">
    <tspan fill="url(#accent)">{&#160;</tspan><tspan fill="#f8fafc">llm-json-extract</tspan><tspan fill="url(#accent)">&#160;}</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">
    Extract clean, validated JSON from messy LLM output
  </text>

  <!-- pipeline strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="600" y="242" text-anchor="middle">
      <tspan fill="#7c8aa5">reasoning · prose · almost-JSON</tspan>
      <tspan fill="#34d399">&#160;&#160;──▶&#160;&#160;</tspan>
      <tspan fill="#e2e8f0">{ clean, typed JSON }</tspan>
      <tspan fill="#34d399">&#160;✓</tspan>
    </text>
  </g>
</svg>
