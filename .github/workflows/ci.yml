name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22", "24", "26"]
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

  minimum-node-runtime:
    # Node 18 is declared in `engines.node` but is end-of-life. We don't run
    # the full lint/typecheck/test suite on it — only the runtime smoke test
    # against the published tarball (ESM + CJS) to confirm the package keeps
    # loading and running on 18.18+. The full matrix above covers 20/22/24/26.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: runtime (${{ matrix.os }}, Node 18)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
      - run: npm run test:smoke
